plugins {
    id "com.gradle.plugin-publish" version "2.1.1"
    id "java-gradle-plugin"
}

repositories {
    maven {
        url = 'https://repo.gradle.org/gradle/libs-releases-local'
    }
    mavenCentral()
    mavenLocal()
}

apply plugin: "java"
apply plugin: "idea"
apply plugin: "maven-publish"

def graphqlCodegenGradlePluginVersion = '6.3.1-SNAPSHOT' // This variable used in the automatic release process

group = "io.github.besi97"
version = graphqlCodegenGradlePluginVersion
description = "Provides a task for generating Java code based on GraphQL schema"

dependencies {
    implementation gradleApi()

    implementation "io.github.besi97:graphql-java-codegen:${version}"

    implementation "org.freemarker:freemarker:2.3.35"
    implementation "com.graphql-java:graphql-java:26.1"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.2"
    implementation "com.typesafe:config:1.4.9"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
}

gradlePlugin {
    website = 'https://github.com/Besi97/graphql-java-codegen/tree/main/plugins/gradle/graphql-java-codegen-gradle-plugin'
    vcsUrl = 'https://github.com/Besi97/graphql-java-codegen'
    plugins {
        graphqlCodegen {
            id = 'io.github.besi97.graphql.codegen'
            displayName = 'GraphQL Java Codegen'
            description = 'Gradle plugin for GraphQL Java code generation'
            implementationClass = 'io.github.besi97.graphql.codegen.gradle.GraphQLCodegenGradlePlugin'
            tags.set(['graphql', 'graphql-java', 'graphql-java-codegen', 'graphql-codegen'])
        }
    }
}
